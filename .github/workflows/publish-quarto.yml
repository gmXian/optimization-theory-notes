name: Publish Quarto Book

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'
          cache: pip
      - name: Install validation dependencies
        run: python -m pip install -r requirements-tools.txt
      - name: Validate source content
        run: |
          python tools/validate_repo.py
          python tools/review_repo.py
          python tools/validate_quarto_structure.py
      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
      - name: Render book
        run: quarto render
      - name: Validate rendered site
        run: python tools/validate_rendered_site.py
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _book

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
